name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, for `integration-network` only — the live provider-contract test that
  # must not sit on the merge path (ADR-0040). 07:10 UTC, off the top of the hour.
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same ref (dev-playbook principle 7). Keyed on the
# event too, so a nightly cron on `main` cannot cancel a push run on `main`.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # installs resolve from uv.lock, never a fresh resolution.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy
      # ...and again with the optional live-trading SDK installed. Extras are NOT
      # part of `uv sync --frozen`, so without this step alpaca-py's real
      # signatures are never checked and the lazily-imported wrapper is typed
      # against a missing import. That is exactly how 8 strict-mode errors in
      # RealAlpacaClient survived to the first live run (ADR-0018 amendment).
      - run: uv sync --frozen --extra alpaca
      - run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest # fast layer only (pyproject deselects integration/e2e)

  # REQUIRED check — and therefore offline (ADR-0040). A required check that calls a
  # third-party API hands that API a veto over every merge: on 2026-08-08 this job
  # failed with YFRateLimitError while landing PR #40, no code involved, and a bare
  # re-run cleared it. Nothing here may reach the open internet; the split-guard test
  # runs off a committed fixture, and the live provider-contract test moved to
  # `integration-network` below.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "integration and not network"

  # NOT a required check, and it does not run on pull requests — every PR run would
  # spend more of the provider's request budget, which is what makes a rate limit
  # most likely exactly when the repo is busiest. Nightly + on demand.
  # DO NOT add this job to branch protection: it never runs on a PR, so requiring it
  # would deadlock every merge.
  #
  # Holds the live provider-contract tests for BOTH providers now (ADR-0046):
  # yfinance (column shape) and Alpaca (adjusted-really-means-adjusted, bar shape,
  # asset metadata). The Alpaca half needs the optional SDK *and* paper credentials
  # from repository secrets; without them those tests skip, and the annotation step
  # below makes that skip visible rather than a green tick over nothing.
  integration-network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # PAPER keys only — nothing in the `network` layer places, cancels, or
      # modifies an order. Absent secrets expand to "", which is exactly what the
      # tests' credential gate checks for, so a fork or an unconfigured repo skips
      # cleanly instead of failing.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The Alpaca SDK is an optional extra and is NOT part of `uv sync --frozen`
      # (ADR-0018). Without it every Alpaca contract test skips on SDK grounds and
      # the credentials would never even be consulted.
      - run: uv sync --frozen --extra alpaca
      - name: Report whether Alpaca credentials are available
        run: |
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ]; then
            echo "::notice title=Alpaca contract tests::Credentials present — the Alpaca provider-contract tests will RUN."
          else
            echo "::warning title=Alpaca contract tests SKIPPED::ALPACA_API_KEY / ALPACA_SECRET_KEY are not set, so the Alpaca provider-contract tests did not run. A green job here does NOT mean Alpaca's contract holds. Add the paper-key secrets (ADR-0046) to enable them."
          fi
      # `-rs` lists every skip with its reason in the run log, so a skipped
      # provider check is legible instead of an invisible dot (ADR-0040: "a
      # skipped provider check is a green tick that means nothing").
      - run: uv run pytest -m network -rs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit
