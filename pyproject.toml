[project]
name = "algo-trading-bench"
version = "0.0.0"
description = "A test bench for backtesting, paper trading, and algorithmic trading strategies on US equities."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "yfinance>=0.2.40",
    "typer>=0.12",
]

[project.optional-dependencies]
# Optional equity-curve image rendering (kept out of the core install).
plot = ["matplotlib>=3.8"]
# Optional web dashboard server (static HTML export needs none of this). FastAPI
# and uvicorn are imported lazily by trading.dashboard.server (ADR-0023), so the
# fast gate stays green without them.
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
trading = "trading.cli:app"

[dependency-groups]
# Dev tooling. `uv sync` installs these by default; CI installs frozen.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

# --- Tests: layer by cost (dev-playbook principle 1) --------------------------
# The default run is the FAST layer only: no network, no external infra.
# Heavier layers opt in by marker and run in CI (see .github/workflows/ci.yml).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not e2e'"
markers = [
    "integration: needs external infra (network / yfinance). CI-only, not in the fast gate.",
    "e2e: boots the full stack end to end. CI-only.",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer's API intentionally puts callables (typer.Option/Argument) in parameter
# defaults; B008 is the wrong lint for that idiom.
"src/trading/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
# yfinance ships no types; don't fail the type gate on a third-party stub gap.
[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
# alpaca-py is an optional, lazily-imported live-trading dependency: it is not
# installed in the fast gate and ships no stubs, so tolerate the missing import
# (RealAlpacaClient converts every SDK response into our own types).
[[tool.mypy.overrides]]
module = ["alpaca.*"]
ignore_missing_imports = true
# fastapi/uvicorn are the optional, lazily-imported dashboard-server dependency:
# not installed in the fast gate, so tolerate the missing import (the server shell
# guards each import and raises a clear ImportError naming the dashboard extra).
[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "starlette.*"]
ignore_missing_imports = true
